    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Net Worth Calculator",
        "url": "https://net-worth-calculator.correia95.workers.dev/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Totals a list of assets and liabilities, grouped by category, to compute net worth and show a per-category breakdown, entirely in the browser."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is net worth calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Net worth is the total value of everything you own (assets) minus everything you owe (liabilities). Add a line for each account, property, loan or balance and the total updates as you type."
            }
          },
          {
            "@type": "Question",
            "name": "What counts as an asset or a liability?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Assets are things with value you could convert to cash: bank balances, investments, retirement accounts, property, vehicles. Liabilities are debts you owe: a mortgage, loans, credit card balances. Enter only the current balance owed for a liability, not the original loan amount."
            }
          },
          {
            "@type": "Question",
            "name": "Is my financial data sent anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Everything is calculated in your browser and only stored in the page's own link, so nothing is uploaded to a server."
            }
          }
        ]
      }
    </script>
